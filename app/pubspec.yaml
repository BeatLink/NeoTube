name: neotube
description: NeoTube — native client for the NeoTube REST API server.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # ── HTTP / API ────────────────────────────────────────────────────────────
  http: ^1.2.2
  # Image caching
  cached_network_image: ^3.4.1

  # ── State management ─────────────────────────────────────────────────────
  flutter_riverpod: ^2.5.1

  # ── Navigation ────────────────────────────────────────────────────────────
  go_router: ^14.3.0

  # ── Video playback ────────────────────────────────────────────────────────
  video_player: ^2.9.1
  chewie: ^1.8.5           # Controls UI wrapper around video_player

  # ── Persistence (local server URL, etc.) ─────────────────────────────────
  shared_preferences: ^2.3.0

  # ── Utilities ────────────────────────────────────────────────────────────
  timeago: ^3.7.0          # "3 years ago" style timestamps
  intl: ^0.19.0            # Number/date formatting

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
